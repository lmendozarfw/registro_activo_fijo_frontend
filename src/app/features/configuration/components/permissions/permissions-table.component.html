<div>
    <div class="mb-4">
        <p class="text-sm text-neutral-600">Puedes ver los permisos disponibles en el sistema.</p>
    </div>

    <div class="mb-4 max-w-md">
        <app-search-input placeholder="Buscar por código, nombre o descripción..."
            (searched)="onSearch($event)" />
    </div>

    @if (store.permissions().length > 0) {
    <p-table [value]="store.permissions()" [loading]="store.loading()" [paginator]="true" [rows]="10"
        [rowsPerPageOptions]="[10, 20]" [tableStyle]="{ 'min-width': '900px' }">
        <ng-template #header>
            <tr>
                <th style="width: 200px">Módulo</th>
                <th style="width: 200px">Código</th>
                <th style="width: 200x">Nombre</th>
                <th>Descripción</th>
            </tr>
        </ng-template>
        <ng-template #body let-permission>
            <tr>
                <td>
                    <span class="inline-block rounded-md bg-neutral-100 px-2 py-1 font-mono text-xs">{{
                        permission.moduleCode || '—' }}</span>
                </td>
                <td>
                    <span class="inline-block rounded-md bg-neutral-100 px-2 py-1 font-mono text-xs">{{ permission.code
                        }}</span>
                </td>
                <td>{{ permission.name }}</td>
                <td>{{ permission.description || '—' }}</td>
            </tr>
        </ng-template>
    </p-table>
    } @else {
    <app-empty-state message="No se encontraron permisos"
        description="No hay permisos disponibles para mostrar." />
    }
</div>
