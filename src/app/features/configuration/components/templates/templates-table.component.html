<div>
    <div class="mb-4">
        <p class="text-sm text-slate-600">Una plantilla de permisos es un conjunto de permisos predefinidos que pueden ser asignados a usuarios dentro del sistema.</p>
    </div>

    <p-table [value]="templates()" [paginator]="true" [rows]="10" [rowsPerPageOptions]="[10, 20]" showGridlines [tableStyle]="{ 'min-width': '50rem' }">
        <ng-template #header>
            <tr>
                <th>Name</th>
                <th>Description</th>
                <th>Permisos</th>
            </tr>
        </ng-template>
        <ng-template #body let-product>
            <tr>
                <td>{{ product.name }}</td>
                <td>{{ product.description }}</td>
                <td>{{ product.permisos }}</td>
            </tr>
        </ng-template>
    </p-table>
</div>
