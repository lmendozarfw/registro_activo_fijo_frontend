<div>
    <div class="mb-4">
        <p class="text-sm text-slate-600">Puedes ver los módulos disponibles en el sistema.</p>
    </div>

    <p-table [value]="modules()" [paginator]="true" [rows]="10" [rowsPerPageOptions]="[10, 20]" [tableStyle]="{ 'min-width': '50rem' }">
        <ng-template #header>
            <tr>
                <th>Code</th>
                <th>Name</th>
                <th>Description</th>
            </tr>
        </ng-template>
        <ng-template #body let-product>
            <tr>
                <td>{{ product.code }}</td>
                <td>{{ product.name }}</td>
                <td>{{ product.description }}</td>
            </tr>
        </ng-template>
    </p-table>
</div>
