<div>
    <div class="mb-4">
        <p class="text-sm text-neutral-600">Puedes ver los módulos disponibles en el sistema.</p>
    </div>

    <div class="mb-4 max-w-md">
        <app-search-input placeholder="Buscar por código, nombre o descripción..."
            (searched)="onSearch($event)" />
    </div>

    @if (store.modules().length > 0) {
    <p-table [value]="store.modules()" [loading]="store.loading()" [paginator]="true" [rows]="10"
        [rowsPerPageOptions]="[10, 20]" [tableStyle]="{ 'min-width': '700px' }">
        <ng-template #header>
            <tr>
                <th style="width: 200px">Código</th>
                <th style="width: 200px">Nombre</th>
                <th>Descripción</th>
            </tr>
        </ng-template>
        <ng-template #body let-module>
            <tr>
                <td>
                    <span class="inline-block rounded-md bg-neutral-100 px-2 py-1 font-mono text-xs">{{ module.code
                        }}</span>
                </td>
                <td>{{ module.name }}</td>
                <td>{{ module.description || '—' }}</td>
            </tr>
        </ng-template>
    </p-table>
    } @else {
    <app-empty-state message="No se encontraron módulos" description="No hay módulos disponibles para mostrar." />
    }
</div>
