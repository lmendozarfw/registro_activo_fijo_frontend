<div class="h-dvh overflow-hidden">
  <p-sidebar-layout class="relative! h-full min-h-full!">
    @if (isMobile()) {
    <p-sidebar-backdrop class="absolute!" />
    }

    <p-sidebar id="comunicacion-nav" variant="floating" [collapsible]="isMobile() ? 'offcanvas' : 'icon'" [overlay]="isMobile()"
      [open]="sidebarOpen()" (openChange)="mobileNavOpen.set($event)" width="17rem">
      <p-sidebar-spacer />
      <p-sidebar-aside>
        <p-sidebar-panel>
          <p-sidebar-header>
            <p-sidebar-menu>
              <p-sidebar-menu-item>
                <div class="flex items-center gap-2">
                  <div class="w-10 h-10 rounded-lg px-1 flex items-center justify-center bg-brand/20">
                    <img src="assets/images/isotipo-sinergy-r.png" alt="Raudal Footwear"
                      class="w-full h-full object-contain" />
                  </div>
                  <p class="text-neutral-50 text-xl font-bold">Sinergy<span class="text-brand">Hub</span></p>
                </div>
              </p-sidebar-menu-item>
            </p-sidebar-menu>
          </p-sidebar-header>

          <p-sidebar-content>
            <app-sidebar-menu [items]="menuItems" (navigated)="closeNav()" />
          </p-sidebar-content>

          <p-sidebar-footer>
            <p-sidebar-menu>
              <p-sidebar-menu-item>
                <button
                      pSidebarMenuButton
                      class="group relative w-full overflow-hidden rounded-2xl px-1! py-2 transition h-10!"
                      (click)="userMenu.toggle($event)"
                    >
                      <div class="flex items-center gap-2">
                        <div class="w-8! h-8! rounded-lg px-1 flex items-center justify-center bg-brand">
                          <span>{{ authStore.user()?.fullName ? authStore.user()?.fullName[0] : 'U' }}</span>
                        </div>
                        <span class="relative flex items-center gap-2 truncate mr-4">
                          {{authStore.user()?.fullName ?? 'Usuario'}}
                        </span>
                      </div>
                      <svg data-p-icon="chevron-down" class="relative ml-auto text-neutral-400 transition group-hover:text-white"></svg>
                    </button>
                <p-menu #userMenu [model]="userItems" [popup]="true" appendTo="body">
                  <ng-template #item let-item>
                    <a class="flex items-center gap-2">
                      <svg [pIcon]="item.icon || ''" [size]="14" class="ml-2"></svg>
                      <span>{{ item.label }}</span>
                    </a>
                  </ng-template>
                </p-menu>
              </p-sidebar-menu-item>
            </p-sidebar-menu>
          </p-sidebar-footer>
        </p-sidebar-panel>
      </p-sidebar-aside>
    </p-sidebar>

    <p-sidebar-main class="min-w-0 overflow-hidden">
      <header class="m-2 rounded-xl ml-2 lg:ml-0 flex h-14 shrink-0 items-center gap-2 bg-white px-4">
        <button pButton pSidebarTrigger target="comunicacion-nav" severity="secondary" text size="small">
          <svg data-p-icon="sidebar"></svg>
        </button>
        <app-header-title />
        <div class="ml-auto flex items-center gap-2">
          <span class="h-7.5 flex items-center rounded-md bg-neutral-100 px-2 py-1 text-xs text-neutral-900">
            {{ 'V.0.1' }}
          </span>
        </div>
      </header>
      <div class="flex-1 min-h-0 overflow-y-auto overflow-x-auto pl-2 lg:pl-0 pt-0 pr-2 flex flex-col mt-4">
        <router-outlet />
      </div>
    </p-sidebar-main>
  </p-sidebar-layout>
</div>
