<div class="h-dvh overflow-hidden">
  <p-sidebar-layout class="relative! h-full min-h-full!">
    @if (isMobile()) {
    <p-sidebar-backdrop class="absolute!" />
    }

    <p-sidebar id="comunicacion-nav" variant="floating" [collapsible]="isMobile() ? 'offcanvas' : 'icon'" [overlay]="isMobile()"
      [open]="sidebarOpen()" (openChange)="mobileNavOpen.set($event)" width="17rem" iconWidth="47px">
      <p-sidebar-spacer />
      <p-sidebar-aside>
        <p-sidebar-panel>
          <app-sidebar-header></app-sidebar-header>

          <p-sidebar-content>
            <app-sidebar-menu [items]="menuItems" (navigated)="closeNav()" />
          </p-sidebar-content>

          <app-sidebar-footer [name]="authStore.user()?.fullName" [userItems]="userItems"></app-sidebar-footer>
        </p-sidebar-panel>
      </p-sidebar-aside>
    </p-sidebar>

    <p-sidebar-main class="min-w-0 overflow-hidden pl-2">
      <header class="m-2 mb-0 shadow-card rounded-xl ml-2 lg:ml-0 flex h-12 shrink-0 items-center gap-2 bg-white px-2 z-100">
        <button pButton pSidebarTrigger target="comunicacion-nav" severity="secondary" text size="small">
          <svg data-p-icon="sidebar"></svg>
        </button>
        <app-header-title />
        <div class="ml-auto flex items-center gap-2">
          <span class="h-7.5 flex items-center rounded-md bg-neutral-100 px-2 py-1 text-xs text-neutral-900">
            {{ 'V.0.1' }}
          </span>
        </div>
      </header>
      <div class="flex-1 min-h-0 overflow-y-auto overflow-x-auto pl-2 lg:pl-0 pt-0 pr-2 flex flex-col pb-2 pt-4">
        <router-outlet />
      </div>
    </p-sidebar-main>
  </p-sidebar-layout>
</div>
